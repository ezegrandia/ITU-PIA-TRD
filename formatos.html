<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatos de Hoja - Normas IRAM</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/formatos.css">
    <link rel="icon" type="image/png" href="img/trd-favicon.svg">
</head>

<body class="app">
    <header class="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo-link">
                <div class="nav__logo">ITU PIA - TRD</div>
            </a>
            <button class="nav__toggle" aria-label="Abrir menú">
                <span class="hamburger-line"></span><span class="hamburger-line"></span><span
                    class="hamburger-line"></span>
            </button>
            <ul class="nav__menu">
                <li class="nav__item"><a href="index.html" class="nav__link">Inicio</a></li>
                <li class="nav__item"><a href="lineas.html" class="nav__link">Tipos de Líneas</a></li>
                <li class="nav__item"><a href="formatos.html" class="nav__link"
                        style="color: var(--primary);">Formatos</a></li>
                <li class="nav__item"><a href="rotulos.html" class="nav__link">Rótulos</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content container">
        <section id="quiz-formatos" class="section section--active">
            <div class="card">
                <h2 style="color: var(--primary); text-align: center;">Práctica de Formatos</h2>
                <div class="quiz__header">
                    <span class="quiz__counter">Pregunta <span id="current-idx">0</span> de <span
                            id="total-idx">0</span></span>
                </div>

                <div id="question-container" class="question-wrapper">
                </div>

                <div id="reference-container" class="quiz__image-box hidden" style="margin-top: 2rem;">
                    <p class="quiz__help-label" style="text-align: center;">Relación visual de formatos</p>
                    <img src="img/formatos-referencia.jpg" alt="Formatos de hoja" class="quiz__img">
                </div>
            </div>

            <div class="quiz__controls">
                <button id="btn-prev" class="btn btn--outline">Atrás</button>
                <button id="btn-ref" class="btn btn--info">Ver imagen de referencia</button>
                <button id="btn-next" class="btn btn--primary">Siguiente</button>
                <button id="btn-finish" class="btn btn--danger">Terminar</button>
                <button id="btn-reset" class="btn btn--outline">Reset</button>
            </div>
        </section>

        <section id="results" class="section">
            <div class="card">
                <h2>Resultados del Quiz de Formatos</h2>
                <div id="results-data" class="results__grid"></div>
                <button class="btn btn--primary" onclick="window.location.href='index.html'"
                    style="margin-top: 1rem;">Volver al Inicio</button>
                <button class="btn btn--outline" id="btn-retry" style="margin-top: 1rem;">Reintentar Quiz</button>
            </div>
        </section>
    </main>

    <script src="js/global.js"></script>
    <script src="js/formatos.js"></script>
</body>

</html>
